- keyname: feed_urls
  field_type: multi_string
  optional: true
  name: Add your own feeds with RSS
  description: |
    Can’t find a favorite publication above? Add its RSS feed here. An RSS feed is a special link that lets Beautiful RSS News collect the publication’s latest stories automatically—no account or API key required.
    <br/><br/>

    To find one, look for an RSS icon or an “RSS” or “Feeds” link in the publication’s footer. You can also try adding <strong>/rss</strong>, <strong>/feed</strong>, or <strong>/feeds</strong> to its website address, or search for the publication’s name followed by “RSS feed.”
    <br/><br/>

    Paste the RSS feed link—not the publication’s homepage or an individual article. Add one feed per field. Feeds that include story images will look best.
  placeholder: https://example.com/rss
- keyname: display_title
  field_type: string
  name: Title bar text
  optional: true
  description: Optional. Replace the title shown at the bottom of the screen.
  placeholder: My Feed Name
- keyname: icon_url
  field_type: url
  name: Custom title-bar icon
  optional: true
  description: Optional. Paste a direct link to a image to replace the title-bar icon.
  placeholder: https://example.com/favicon.ico
- keyname: about
  name: About This Plugin
  category: news
  field_type: author_bio
  description: |
    Beautiful RSS News turns your favorite publications into a beautiful news briefing made for TRMNL. Start with our curated selections or add publications you already love. Follow one source or combine several in a single feed.
    <br/><br/>
    No technical setup is needed. Pick your sources, save the plugin, and enjoy your favorite news in one beautiful feed.
  github_url: https://github.com/martin2097
  learn_more_url: https://www.rapavy.cz/
  email_address: rapavy.mato@gmail.com
name: Beautiful RSS News
refresh_interval: 15
